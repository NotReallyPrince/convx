name: Stable Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build_stable:
    name: Build and publish signed release APKs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug.keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # An unsigned release cannot be installed over a signed one, so a missing key stops the release here.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE secret is not set"; exit 1; }
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore

      - name: Build release APKs
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # gradle.properties tunes the daemon for small machines (C1-only JIT, serial GC), which makes R8 crawl.
        # The 16 GB runner can give R8 the full JIT and a parallel GC.
        run: |
          ./gradlew "-Dorg.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8" \
            assembleArm64GmsRelease assembleArm32GmsRelease assembleX86_64GmsRelease assembleUniversalGmsRelease \
            --no-configuration-cache --console=plain --warning-mode summary -x lint

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          mkdir -p dist
          for abi in arm64 arm32 x86_64 universal; do
            apk=$(find "app/build/outputs/apk/${abi}Gms/release" -name '*.apk' | head -n 1)
            test -n "$apk" || { echo "no APK for $abi"; exit 1; }
            cp "$apk" "dist/convx-${VERSION}-${abi}.apk"
          done
          ls -la dist
          NOTES=".github/release-notes/${VERSION}.md"
          test -f "$NOTES" || NOTES=/dev/null
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" dist/*.apk --repo "${{ github.repository }}" --title "Convx ${VERSION}" --notes-file "$NOTES" --latest
          fi
